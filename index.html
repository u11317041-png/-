<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語互動繪本 - 幫小熊買水果</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        .font-en-storybook {
            font-family: 'Fredoka', sans-serif;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes pageFlip {
            0% { transform: rotateY(0deg); opacity: 1; }
            50% { transform: rotateY(-90deg); opacity: 0.5; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-page-flip { animation: pageFlip 0.6s ease-in-out forwards; transform-style: preserve-3d; }
        .animate-confetti { animation: confettiFall linear forwards; position: fixed; z-index: 60; }
        
        /* 繪本擬真陰影 */
        .storybook-shadow {
            box-shadow: 0 30px 60px -12px rgba(139, 92, 26, 0.25), 
                        0 18px 36px -18px rgba(0, 0, 0, 0.3), 
                        inset 0 0 20px rgba(0,0,0,0.02);
        }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#FDF8E7] min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 過關撒紙屑特效 ---
        const Confetti = () => {
            const pieces = Array.from({ length: 30 }).map((_, i) => ({
                id: i,
                left: `${Math.random() * 100}%`,
                animationDuration: `${Math.random() * 1.5 + 1.5}s`,
                animationDelay: `${Math.random() * 0.2}s`,
                backgroundColor: ['#FF3D00', '#FFD600', '#4CAF50', '#2196F3', '#9C27B0'][Math.floor(Math.random() * 5)]
            }));

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-40 rounded-[24px]">
                    {pieces.map(p => (
                        <div 
                            key={p.id}
                            className="absolute top-[-20px] w-2.5 h-3.5 animate-confetti rounded-sm shadow-sm"
                            style={{
                                left: p.left,
                                backgroundColor: p.backgroundColor,
                                animationDuration: p.animationDuration,
                                animationDelay: p.animationDelay
                            }}
                        />
                    ))}
                </div>
            );
        };

        const COLOR_LEVELS = [
            { 
                id: 1, targetColors: ['#FF3D00'], objectName: { zh: '蘋果', en: 'Apple' }, emoji: '🍎',
                storyZh: '熊媽媽想做蘋果派，請小熊去買紅色的蘋果。',
                storyEn: 'Mama Bear wants to make a pie. She asked Little Bear to buy red apples.',
                path: "M 100,65 C 75,60 45,65 45,112 C 45,152 75,172 100,163 C 125,172 155,152 155,112 C 155,65 125,60 100,65 Z"
            },
            { 
                id: 2, targetColors: ['#4CAF50'], objectName: { zh: '樹葉', en: 'Leaf' }, emoji: '🌿',
                storyZh: '蘋果上需要有新鮮的綠色樹葉！',
                storyEn: 'The apples need fresh green leaves on them!',
                path: "M 100,35 C 55,72 50,142 100,182 C 150,142 145,72 100,35 Z"
            },
            { 
                id: 3, targetColors: ['#FFD600'], objectName: { zh: '香蕉', en: 'Banana' }, emoji: '🍌',
                storyZh: '接著，熊媽媽請小熊尋找甜甜的黃色香蕉。',
                storyEn: 'Next, Mama Bear asked Little Bear to find sweet yellow bananas.',
                path: "M 152,58 C 120,58 60,90 50,162 C 72,162 125,120 152,58 Z"
            },
            { 
                id: 4, targetColors: ['#FF9800'], objectName: { zh: '橘子', en: 'Orange' }, emoji: '🍊',
                storyZh: '小熊還需要買多汁的橘色橘子！',
                storyEn: 'Little Bear also needs to buy juicy orange oranges!',
                path: "M 100,55 C 142,55 170,83 170,122 C 170,162 142,190 100,190 C 58,190 30,162 30,122 C 30,83 58,55 100,55 Z"
            },
            { 
                id: 5, targetColors: ['#9C27B0'], objectName: { zh: '葡萄', en: 'Grapes' }, emoji: '🍇',
                storyZh: '最後是熊媽媽最喜歡的紫色葡萄。',
                storyEn: 'Finally, Mama Bear\'s favorite purple grapes.',
                path: "M 80,90 A 15,15 0 1,1 80,89.9 Z M 100,90 A 15,15 0 1,1 100,89.9 Z M 120,90 A 15,15 0 1,1 120,89.9 Z M 90,115 A 15,15 0 1,1 90,114.9 Z M 110,115 A 15,15 0 1,1 110,114.9 Z M 100,140 A 15,15 0 1,1 100,139.9 Z"
            }
        ];

        const COUNT_LEVELS = [
            {
                id: 1, targetCount: 3, emoji: '🍎', objectName: { zh: '蘋果', en: 'apples' },
                storyZh: '小熊來到果園，請幫他把 3 顆蘋果放進籃子！',
                storyEn: 'Little Bear is at the orchard. Help him put 3 apples into the basket!',
                positions: [ {x:20, y:15}, {x:45, y:10}, {x:70, y:15}, {x:15, y:35}, {x:38, y:28}, {x:60, y:25}, {x:78, y:35}, {x:28, y:48}, {x:50, y:46}, {x:72, y:48} ]
            },
            {
                id: 2, targetCount: 5, emoji: '🍊', objectName: { zh: '橘子', en: 'oranges' },
                storyZh: '做得好！現在小熊需要採 5 顆橘子。',
                storyEn: 'Good job! Now Little Bear needs to pick 5 oranges.',
                positions: [ {x:20, y:15}, {x:45, y:10}, {x:70, y:15}, {x:15, y:35}, {x:38, y:28}, {x:60, y:25}, {x:78, y:35}, {x:28, y:48}, {x:50, y:46}, {x:72, y:48} ]
            },
            {
                id: 3, targetCount: 4, emoji: '🍇', objectName: { zh: '葡萄', en: 'grapes' },
                storyZh: '最後，請幫小熊收集 4 串葡萄帶回家！',
                storyEn: 'Lastly, help Little Bear collect 4 bunches of grapes to take home!',
                positions: [ {x:20, y:15}, {x:45, y:10}, {x:70, y:15}, {x:15, y:35}, {x:38, y:28}, {x:60, y:25}, {x:78, y:35}, {x:28, y:48}, {x:50, y:46}, {x:72, y:48} ]
            }
        ];

        const COLORS = [
            { zh: '紅色', en: 'Red', code: '#FF3D00' },
            { zh: '黃色', en: 'Yellow', code: '#FFD600' },
            { zh: '綠色', en: 'Green', code: '#4CAF50' },
            { zh: '藍色', en: 'Blue', code: '#2196F3' },
            { zh: '橘色', en: 'Orange', code: '#FF9800' },
            { zh: '紫色', en: 'Purple', code: '#9C27B0' }
        ];

        const App = () => {
            const [hasStarted, setHasStarted] = useState(false);
            const [gameStage, setGameStage] = useState('color'); 
            const [levelIdx, setLevelIdx] = useState(0);
            const [coverage, setCoverage] = useState(0);
            const [isCompleted, setIsCompleted] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [selectedColor, setSelectedColor] = useState(null);
            const [pointerPos, setPointerPos] = useState(null);
            const [isFlipping, setIsFlipping] = useState(false);
            
            const [basketCount, setBasketCount] = useState(0);
            const [droppedFruits, setDroppedFruits] = useState([]); // 存儲放進籃子內的水果索引

            const canvasRef = useRef(null);
            const maskCanvasRef = useRef(null);
            const ctxRef = useRef(null);
            const lastPos = useRef({ x: 0, y: 0 });

            const currentColorLevel = COLOR_LEVELS[levelIdx];
            const currentCountLevel = COUNT_LEVELS[levelIdx];

            // 計算目前總頁數與進度 (總共：5頁著色 + 3頁數數)
            const currentGlobalPage = gameStage === 'color' ? levelIdx + 1 : COLOR_LEVELS.length + levelIdx + 1;
            const totalPages = COLOR_LEVELS.length + COUNT_LEVELS.length;

            const speakBilingual = (zhText, enText) => {
                if ('speechSynthesis' in window) {
                    if (window.__zhUtterance) window.__zhUtterance.onend = null;
                    window.speechSynthesis.cancel();
                    
                    const zhUtterance = new SpeechSynthesisUtterance(zhText);
                    zhUtterance.lang = 'zh-TW';
                    zhUtterance.rate = 0.9;
                    window.__zhUtterance = zhUtterance; 

                    const enUtterance = new SpeechSynthesisUtterance(enText);
                    enUtterance.lang = 'en-US';
                    enUtterance.rate = 0.9;

                    zhUtterance.onend = () => {
                        if (enText) window.speechSynthesis.speak(enUtterance);
                    };
                    window.speechSynthesis.speak(zhUtterance);
                }
            };

            const speakQuestion = () => {
                if (!hasStarted) return;
                if (gameStage === 'color') {
                    const zhText = `${currentColorLevel.storyZh} 你能幫小熊畫上正確的顏色嗎？`;
                    const enText = `${currentColorLevel.storyEn} Can you help Little Bear color it?`;
                    speakBilingual(zhText, enText);
                } else if (gameStage === 'count') {
                    speakBilingual(currentCountLevel.storyZh, currentCountLevel.storyEn);
                } else if (gameStage === 'end') {
                    speakBilingual('熊媽媽非常開心小熊完成了所有的任務！她送給小熊一台玩具小汽車作為獎勵！', 'Mama Bear is very happy that Little Bear completed all the tasks! She gave him a toy car as a reward!');
                }
            };

            const initCanvas = () => {
                if (gameStage !== 'color' || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctxRef.current = ctx;
                ctx.clearRect(0, 0, 200, 200);

                const mCanvas = document.createElement('canvas');
                mCanvas.width = 200; mCanvas.height = 200;
                maskCanvasRef.current = mCanvas;
                const mCtx = mCanvas.getContext('2d');
                mCtx.clearRect(0, 0, 200, 200);
                const pathObj = new Path2D(currentColorLevel.path);
                mCtx.fillStyle = '#000000';
                mCtx.fill(pathObj);
            };

            useEffect(() => {
                if (!hasStarted) return;
                if (gameStage === 'color') {
                    initCanvas();
                    setCoverage(0);
                } else if (gameStage === 'count') {
                    setBasketCount(0);
                    setDroppedFruits([]);
                }
                setIsCompleted(false);
                setSelectedColor(null); 
                
                const timer = setTimeout(() => {
                    speakQuestion();
                }, 300);
                return () => clearTimeout(timer);
            }, [levelIdx, gameStage, hasStarted]);

            const handleNextLevel = () => {
                if (isFlipping) return;
                setIsFlipping(true);
                
                // 翻頁擬真動畫控制
                setTimeout(() => {
                    if (gameStage === 'color') {
                        if (levelIdx + 1 < COLOR_LEVELS.length) {
                            setLevelIdx(levelIdx + 1);
                        } else {
                            setGameStage('count');
                            setLevelIdx(0);
                        }
                    } else if (gameStage === 'count') {
                        if (levelIdx + 1 < COUNT_LEVELS.length) {
                            setLevelIdx(levelIdx + 1);
                        } else {
                            setGameStage('end');
                        }
                    }
                    setIsFlipping(false);
                }, 300);
            };

            const handleFruitClick = (index) => {
                if (isCompleted || droppedFruits.includes(index)) return;

                const nextCount = basketCount + 1;
                
                if (nextCount > currentCountLevel.targetCount) {
                    speakBilingual("哎呀！小熊拿錯數量了，籃子裝不下了！", "Oops! Little Bear picked too many!");
                    setBasketCount(0);
                    setDroppedFruits([]);
                    return;
                }

                setDroppedFruits([...droppedFruits, index]);
                setBasketCount(nextCount);
                speakBilingual(`${nextCount}`, `${nextCount}`);

                if (nextCount === currentCountLevel.targetCount) {
                    setIsCompleted(true);
                    const winZh = `太棒了！小熊成功買到了 ${currentCountLevel.targetCount} 顆${currentCountLevel.objectName.zh}！可以翻到下一頁囉！`;
                    const winEn = `Great! Little Bear got ${currentCountLevel.targetCount} ${currentCountLevel.objectName.en}! Let's go to the next page!`;
                    speakBilingual(winZh, winEn);
                }
            };

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (200 / rect.width),
                    y: (clientY - rect.top) * (200 / rect.height)
                };
            };

            const drawSegment = (x1, y1, x2, y2) => {
                const ctx = ctxRef.current;
                ctx.save();
                ctx.beginPath();
                ctx.clip(new Path2D(currentColorLevel.path)); 
                ctx.globalAlpha = 0.85; 
                ctx.lineWidth = 26; 
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = selectedColor.code;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.restore();
            };

            const handleStart = (e) => {
                if (isCompleted) return;
                if (!selectedColor) {
                    speakBilingual("請先幫小熊選一個彩筆喔！", "Please choose a color for Little Bear!");
                    return;
                }
                if (!currentColorLevel.targetColors.includes(selectedColor.code)) {
                    speakBilingual(
                        `不對喔，小熊媽媽說${currentColorLevel.objectName.zh}不是${selectedColor.zh}的！`, 
                        `No, Mama Bear said ${currentColorLevel.objectName.en} is not ${selectedColor.en}!`
                    );
                    return;
                }
                setIsDrawing(true);
                const pos = getPos(e);
                lastPos.current = pos;
                setPointerPos(pos);
                drawSegment(pos.x, pos.y, pos.x, pos.y);
            };

            const handleMove = (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                drawSegment(lastPos.current.x, lastPos.current.y, pos.x, pos.y);
                lastPos.current = pos;
                setPointerPos(pos);
            };

            const handleEnd = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                setPointerPos(null);
                
                const drawData = ctxRef.current.getImageData(0,0,200,200).data;
                const maskData = maskCanvasRef.current.getContext('2d').getImageData(0,0,200,200).data;
                let totalPixels = 0, coloredPixels = 0;
                
                for (let i = 0; i < maskData.length; i += 4) {
                    if (maskData[i+3] > 0) { 
                        totalPixels++;
                        if (drawData[i+3] > 50) { 
                            coloredPixels++;
                        }
                    }
                }
                
                const percent = totalPixels > 0 ? (coloredPixels / totalPixels) * 100 : 0;
                setCoverage(percent);
                
                if (percent >= 65 && !isCompleted) {
                    setIsCompleted(true);
                    const finalZh = `太棒了！小熊畫出了完美的${selectedColor.zh}${currentColorLevel.objectName.zh}！可以翻到下一頁囉！`;
                    const finalEn = `Wonderful! Little Bear drew a perfect ${selectedColor.en} ${currentColorLevel.objectName.en}! Let's go to the next page!`;
                    speakBilingual(finalZh, finalEn);
                }
            };

            // --- 繪本封面 ---
            if (!hasStarted) {
                return (
                    <div className="flex items-center justify-center p-4 font-sans">
                        <div className="bg-white p-8 rounded-[32px] storybook-shadow text-center max-w-sm border-[10px] border-[#D1A153] animate-pop-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-32 bg-amber-50 -z-10 rounded-b-full"></div>
                            <div className="text-[80px] mb-2 drop-shadow-md">🐻</div>
                            <h1 className="text-3xl font-black text-amber-900 mb-4 tracking-wider">雙語互動繪本</h1>
                            <div className="bg-amber-500 text-white text-xl font-bold py-1 px-4 rounded-full inline-block mb-4">幫小熊買水果</div>
                            <p className="text-gray-600 font-bold text-base mb-8 leading-relaxed">
                                小熊媽媽請小熊去買水果，<br/>但他不太會認顏色和數數...<br/><span className="text-amber-600">你可以翻開書本幫幫他嗎？</span>
                            </p>
                            <button 
                                onClick={() => setHasStarted(true)}
                                className="bg-amber-600 text-white text-lg font-black py-4 px-8 rounded-2xl shadow-[0_5px_0_#78350f] hover:bg-amber-500 active:translate-y-[4px] active:shadow-none transition-all w-full flex justify-center items-center gap-2 cursor-pointer"
                            >
                                📖 翻開繪本 ➔
                            </button>
                        </div>
                    </div>
                );
            }

            // --- 完美結局書頁 ---
            if (gameStage === 'end') {
                return (
                    <div className="flex items-center justify-center p-4 font-sans">
                        <div className="bg-white p-8 rounded-[32px] storybook-shadow text-center max-w-md border-[10px] border-[#D1A153] animate-pop-in relative overflow-hidden">
                            <div className="text-[70px] mb-2 drop-shadow-md">🎉 🚗 🐻</div>
                            <h1 className="text-3xl font-black text-green-600 mb-4 tracking-wider">快樂的大結局</h1>
                            <p className="text-gray-700 font-bold text-lg mb-3 leading-relaxed">
                                熊媽媽非常開心小熊完成了跑腿任務！<br/>
                                <span className="text-rose-500">她送給小熊一台玩具小汽車作為獎勵！</span>
                            </p>
                            <p className="font-en-storybook text-base font-medium text-gray-400 italic mb-8">
                                Mama Bear is very happy that Little Bear completed all the tasks! She gave him a toy car as a reward!
                            </p>
                            <button 
                                onClick={() => {
                                    setGameStage('color');
                                    setLevelIdx(0);
                                }}
                                className="bg-green-600 text-white text-lg font-black py-4 px-8 rounded-2xl shadow-[0_5px_0_#166534] hover:bg-green-500 active:translate-y-[4px] active:shadow-none transition-all w-full cursor-pointer"
                            >
                                🔄 重讀故事繪本
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full flex flex-col items-center p-2 font-sans select-none">
                    
                    {/* 雙頁立體精裝繪本主體 */}
                    <div className={`w-full bg-[#FCF8EE] rounded-[24px] storybook-shadow border-4 border-[#B8862B] relative flex flex-col md:flex-row overflow-hidden transition-all duration-500 ${isFlipping ? 'animate-page-flip' : ''}`}>
                        
                        {/* 繪本中間：立體書脊陰影線 */}
                        <div className="absolute top-0 bottom-0 left-1/2 w-[3px] bg-gradient-to-r from-black/10 via-black/20 to-transparent z-30 hidden md:block" />
                        <div className="absolute top-0 bottom-0 left-1/2 w-[15px] -translate-x-1/2 bg-gradient-to-r from-black/5 via-transparent to-black/5 z-30 hidden md:block" />

                        {/* ================= 左書頁：故事引導區 ================= */}
                        <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between bg-[#FDFBF7] relative border-b-2 md:border-b-0 md:border-r border-amber-100/60">
                            
                            {/* 頁碼提示 */}
                            <div className="text-xs font-bold text-amber-800/40 font-en-storybook mb-4">
                                PAGE {currentGlobalPage} OF {totalPages}
                            </div>

                            {/* 熊媽媽的對話泡泡 */}
                            <div className="flex-1 flex flex-col justify-center items-center my-4 text-center">
                                <div className="text-5xl mb-3 animate-bounce">🐻👩</div>
                                <div className="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 shadow-sm relative max-w-sm">
                                    <h2 className="text-xl font-black text-gray-800 tracking-wider leading-relaxed">
                                        {gameStage === 'color' ? currentColorLevel.storyZh : currentCountLevel.storyZh}
                                    </h2>
                                    <p className="font-en-storybook text-sm font-medium text-amber-700/60 italic mt-2 px-2">
                                        {gameStage === 'color' ? currentColorLevel.storyEn : currentCountLevel.storyEn}
                                    </p>
                                    <button 
                                        onClick={speakQuestion} 
                                        className="absolute -right-3 -top-3 text-xl bg-white hover:bg-amber-100 p-2 rounded-full border border-amber-200 shadow-md transition-transform active:scale-90"
                                    >
                                        🔊
                                    </button>
                                </div>
                            </div>

                            {/* 左頁底部：操作提示面板 */}
                            <div className="mt-4">
                                {gameStage === 'color' ? (
                                    <div className="bg-white/80 rounded
